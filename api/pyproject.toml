[project]
name = "transcript-desk-api"
version = "0.1.0"
description = "Short-form video transcript library with an MCP server"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "mcp>=1.12",
    "yt-dlp[default,deno]>=2026.10.26",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
