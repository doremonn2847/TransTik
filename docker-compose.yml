# Transcript Desk
#   docker compose up -d --build               web app on http://localhost:3000, MCP on http://localhost:8765/mcp
#   docker compose --profile tunnel up -d      also expose MCP (only MCP) to ChatGPT / claude.ai over HTTPS
#
# Every port is bound to 127.0.0.1, so nothing is reachable from other devices on your network.

name: transcript-desk

services:
  api:
    build: ./api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TUNNEL_METRICS_URL: http://tunnel:2000
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8765:8765"

  web:
    build:
      context: ./web
      args:
        API_URL: http://api:8765
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"

  # Cloudflare quick tunnel. Points ONLY at the api's public listener (8766), which answers
  # nothing except /mcp/<secret>. The web app and REST API are never exposed.
  tunnel:
    image: cloudflare/cloudflared:2024.12.2
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://api:8766
    depends_on:
      - api
